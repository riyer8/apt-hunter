<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AptWatch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>AptWatch</h1>
      <button id="dashboard-button" type="button" class="header-link">Dashboard</button>
    </header>

    <p id="backend-status" class="backend-status" hidden></p>

    <section class="changes-section">
      <div class="section-head">
        <h2>Recent changes</h2>
        <button id="refresh-button" type="button" class="header-link">Refresh</button>
      </div>
      <p id="changes-loading" class="muted">Loading…</p>
      <p id="changes-error" class="error" hidden></p>
      <p id="changes-empty" class="empty" hidden>None in the last 48 hours</p>
      <ul id="changes-list" hidden></ul>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
