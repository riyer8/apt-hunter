<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AptWatch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>AptWatch</h1>
      <div class="header-actions">
        <button id="dashboard-button" type="button" class="header-link">Dashboard</button>
        <button id="test-toggle" type="button" class="header-link" aria-expanded="false">Test</button>
        <label class="diag-toggle">
          <input id="diagnostics-toggle" type="checkbox" />
          Diagnostics
        </label>
      </div>
    </header>

    <section id="test-extract" class="test-extract" hidden>
      <p class="hint">Paste a URL to inspect extraction. Nothing is saved.</p>
      <div class="test-row">
        <input
          id="test-url-input"
          type="url"
          placeholder="https://example.com/apartments"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="test-extract-button" type="button">Run</button>
        <button id="clear-test-button" type="button" class="secondary" hidden>Clear</button>
      </div>
      <p id="test-error" class="error" hidden></p>
      <div id="test-report"></div>
    </section>

    <form id="add-form">
      <label for="name-input">Apartment name</label>
      <input
        id="name-input"
        name="name"
        type="text"
        placeholder="The Helix"
        autocomplete="off"
        spellcheck="true"
      />

      <label for="url-input">Apartment availability URL</label>
      <input
        id="url-input"
        name="url"
        type="url"
        placeholder="https://example.com/apartments"
        autocomplete="off"
        spellcheck="false"
      />

      <button type="submit">Add Apartment</button>
      <p id="form-error" class="error" hidden></p>
    </form>

    <section class="monitored">
      <h2>Monitored Apartments</h2>
      <p id="empty-state" class="empty">No apartments yet.</p>
      <ul id="apartment-list"></ul>
      <p class="persist-note">Your buildings, listings, and price history stay in this extension. Clearing cookies or cache does not wipe them.</p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
